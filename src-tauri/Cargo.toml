[package]
name = "clawdesk"
version = "0.1.0"
description = "OpenClaw Manager - UI para configurar y gestionar OpenClaw"
authors = ["clawdesk"]
edition = "2021"

[lib]
name = "clawdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
dirs = "5"
tokio = { version = "1", features = ["process"] }

